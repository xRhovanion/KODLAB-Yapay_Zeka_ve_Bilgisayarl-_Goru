<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Haber sınıflandırma | KODLAB</title>
  <style>
    body { font: 1rem system-ui, sans-serif; color: #172033; background: #f5f7fc;
           max-width: 48rem; margin: 3rem auto; padding: 0 1rem; }
    form { padding: 1.5rem; background: white; border: 1px solid #d4dbea; border-radius: .75rem; }
    label, textarea { display: block; }
    textarea { width: 100%; min-height: 10rem; margin: .75rem 0; box-sizing: border-box; font: inherit; }
    button { background: #16488c; color: white; border: 0; border-radius: .35rem;
             padding: .7rem 1.2rem; font: inherit; cursor: pointer; }
    footer { margin-top: 2rem; color: #485570; }
  </style>
</head>
<body>
  <h1>Haber metni sınıflandırma</h1>
  <p>Eğitilmiş LSTM modeli, yapıştırdığın metne veri kümesindeki bir etiketi atar.</p>
  <form action="/analiz" method="post">
    <input type="hidden" name="tip" value="metin">
    <label for="news">Haber metni</label>
    <textarea id="news" name="veri" required maxlength="30000"></textarea>
    <button type="submit">Sınıflandır</button>
    <p id="result" role="status"></p>
  </form>
  <footer>Kaynak: Ümit Aksoylu, <i>Projelerle Yapay Zekâ ve Bilgisayarlı Görü</i>.</footer>
  <script>
    const form = document.querySelector("form");
    const result = document.querySelector("#result");
    const button = form.querySelector("button");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      result.textContent = "Sınıflandırılıyor…";
      try {
        const response = await fetch(form.action, { method: "POST", body: new FormData(form) });
        result.textContent = await response.text();
      } catch {
        result.textContent = "Yerel sunucuya ulaşılamadı.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
